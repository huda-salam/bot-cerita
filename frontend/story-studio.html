<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Cerita — Story Studio</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#20242a}.app{display:grid;grid-template-columns:280px 1fr 360px;min-height:100vh}.side,.inspector{background:#fff;padding:20px;border-right:1px solid #ddd}.inspector{border-left:1px solid #ddd;border-right:0}.main{padding:24px}.card,.panel,.asset{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:12px}.btn{border:1px solid #bbb;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.primary{background:#222;color:#fff}.muted{color:#68707a;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.asset img{width:100%;height:130px;object-fit:cover;border-radius:8px;background:#eee}.asset.selected{outline:2px solid #222}.tag{display:inline-block;font-size:11px;background:#eee;padding:3px 6px;border-radius:5px;margin:2px}textarea,input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;margin:6px 0 12px}hr{border:0;border-top:1px solid #ddd;margin:18px 0}</style></head><body><div class="app"><aside class="side"><h2>Story Studio</h2><div class="muted">Universe</div><select id="universes" onchange="loadCharacters()"></select><div class="muted">Project</div><input id="title" placeholder="Judul project"><button class="btn primary" onclick="createProject()">Buat Project</button><p id="projectInfo" class="muted"></p><hr><h3>Characters</h3><div id="characters" class="muted">Pilih universe.</div></aside><main class="main"><h1 id="heading">New Story</h1><div class="card"><h3>Story Idea</h3><textarea id="idea" rows="5" placeholder="Masukkan ide cerita..."></textarea><button class="btn" onclick="addScene()">+ Scene</button></div><div class="card"><h3>Scenes</h3><div id="scenes" class="muted">Belum ada scene.</div></div></main><aside class="inspector"><h3>Selected Character References</h3><div id="refs" class="grid"><span class="muted">Belum ada karakter dipilih.</span></div><hr><h3>Style Bible</h3><textarea id="style" rows="7" placeholder="Gaya visual, warna, tone..."></textarea><button class="btn primary" onclick="saveProject()">Simpan</button><hr><pre id="api">Project belum dipilih.</pre></aside></div><script>let project=null,characters=[];const $=id=>document.getElementById(id);async function req(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){try{const us=await req('/universes');$('universes').innerHTML=us.map(u=>`<option value="${u.id}">${u.name||u.id}</option>`).join('');await loadCharacters()}catch(e){console.error(e)}}async function loadCharacters(){const id=$('universes').value;if(!id)return;try{characters=await req('/universes/'+id+'/characters');$('characters').innerHTML=characters.map(c=>`<button class="btn" style="margin:3px" onclick="attach('${c.id}')">${c.name||c.id}</button>`).join('')||'<span class="muted">Belum ada karakter.</span>'}catch(e){console.error(e)}}async function createProject(){project=await req('/studio/projects',{method:'POST',body:JSON.stringify({title:$('title').value||'Untitled Story',universe_id:$('universes').value||null})});await refresh()}async function attach(characterId){if(!project)return alert('Buat project dulu');await req('/studio/projects/'+project.id+'/characters',{method:'POST',body:JSON.stringify({character_id:characterId})});await refresh()}async function refresh(){if(!project)return;project=await req('/studio/projects/'+project.id);$('heading').textContent=project.title;$('style').value=project.style_bible||'';$('projectInfo').textContent=project.id;$('scenes').innerHTML=(project.scenes||[]).map(s=>`<div class="panel"><b>Scene ${s.scene_number}: ${s.title}</b><p>${s.summary||''}</p><span class="muted">${s.status}</span></div>`).join('')||'Belum ada scene.';$('refs').innerHTML=(project.reference_assets||[]).map(a=>`<div class="asset"><div class="muted">${a.character_id.slice(0,8)}</div><img src="${a.file_path}" onerror="this.style.display='none'"><span class="tag">${a.view||'reference'}</span><span class="tag">${a.pose||''}</span></div>`).join('')||'<span class="muted">Belum ada reference.</span>';$('api').textContent=JSON.stringify({project:project.id,characters:project.character_ids||[],references:(project.reference_assets||[]).length},null,2)}async function saveProject(){if(!project)return alert('Buat project dulu');await req('/studio/projects/'+project.id,{method:'PATCH',body:JSON.stringify({style_bible:$('style').value})});await refresh()}async function addScene(){if(!project)return alert('Buat project dulu');const n=(project.scenes?.length||0)+1;await req('/studio/projects/'+project.id+'/scenes',{method:'POST',body:JSON.stringify({scene_number:n,title:'Scene '+n,summary:$('idea').value||''})});await refresh()}load();</script></body></html>
