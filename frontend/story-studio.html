<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Cerita — Story Studio</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#20242a}.app{display:grid;grid-template-columns:260px 1fr 320px;min-height:100vh}.side,.inspector{background:#fff;padding:20px;border-right:1px solid #ddd}.inspector{border-left:1px solid #ddd;border-right:0}.main{padding:24px}.card,.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:16px}.btn{border:1px solid #bbb;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#222;color:#fff}.muted{color:#68707a;font-size:13px}textarea,input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;margin:6px 0 12px}</style></head><body><div class="app"><aside class="side"><h2>Story Studio</h2><div class="muted">Universe</div><select id="universes"></select><div class="muted">Project</div><input id="title" placeholder="Judul project"><button class="btn primary" onclick="createProject()">Buat Project</button><p id="projectInfo" class="muted"></p></aside><main class="main"><h1 id="heading">New Story</h1><div class="card"><h3>Story Idea</h3><textarea id="idea" rows="5" placeholder="Masukkan ide cerita..."></textarea><button class="btn" onclick="addScene()">+ Scene</button></div><div class="card"><h3>Scenes</h3><div id="scenes" class="muted">Belum ada scene.</div></div></main><aside class="inspector"><h3>Project Inspector</h3><label>Style Bible</label><textarea id="style" rows="8" placeholder="Gaya visual, warna, tone..."></textarea><button class="btn primary" onclick="saveProject()">Simpan Style</button><hr><pre id="api">Project belum dipilih.</pre></aside></div><script>let project=null;const $=id=>document.getElementById(id);async function req(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){try{const us=await req('/universes');$('universes').innerHTML=us.map(u=>`<option value="${u.id}">${u.name||u.id}</option>`).join('')}catch(e){console.error(e)}}async function createProject(){project=await req('/studio/projects',{method:'POST',body:JSON.stringify({title:$('title').value||'Untitled Story',universe_id:$('universes').value||null})});await refresh()}async function refresh(){if(!project)return;project=await req('/studio/projects/'+project.id);$('heading').textContent=project.title;$('style').value=project.style_bible||'';$('projectInfo').textContent=project.id;$('scenes').innerHTML=(project.scenes||[]).map(s=>`<div class="panel"><b>Scene ${s.scene_number}: ${s.title}</b><p>${s.summary||''}</p><span class="muted">${s.status}</span></div>`).join('')||'Belum ada scene.';$('api').textContent=JSON.stringify({project:project.id,universe:project.universe_id,scenes:(project.scenes||[]).length},null,2)}async function saveProject(){if(!project)return alert('Buat project dulu');await req('/studio/projects/'+project.id,{method:'PATCH',body:JSON.stringify({style_bible:$('style').value})});await refresh()}async function addScene(){if(!project)return alert('Buat project dulu');const n=(project.scenes?.length||0)+1;await req('/studio/projects/'+project.id+'/scenes',{method:'POST',body:JSON.stringify({scene_number:n,title:'Scene '+n,summary:$('idea').value||''})});await refresh()}load();</script></body></html>
